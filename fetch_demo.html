<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .top-bar {
            width: 90vw;
            margin: 30px auto 10px;
            display: flex;
            justify-content: flex-end;
        }

        .order-btn {
            background-color: green;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .order-btn:hover {
            background-color: darkgreen;
        }

        table {
            width: 90vw;
            border-collapse: collapse;
            margin: 10px auto;
        }

        th,
        td {
            border: 1px solid rgb(255, 0, 0);
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }

        img {
            object-fit: cover;
            border-radius: 5px;
        }

        /* Quantity buttons */
        .quantity-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .quantity-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity {
            width: 25px;
            font-weight: bold;
        }

        /* Add to Cart */
        .add-cart {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .add-cart input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #orderDetails {
            width: 90vw;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ccc;
            display: none;
        }
    </style>

</head>

<body>

    <h1 style="text-align: center;">
        Product List
    </h1>


    <!-- Place Order Button -->

    <div class="top-bar">

        <button class="order-btn" onclick="placeOrder()">
            Place Order
        </button>

    </div>


    <table>

        <thead>

            <tr>
                <th>Sr.No.</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price (₹)</th>
                <th>Stock</th>
                <th>Quantity / Add to Cart</th>
            </tr>

        </thead>


        <tbody id="productTable">
        </tbody>

    </table>


    <!-- Order Details -->

    <div id="orderDetails"></div>


    <script>

        const URL =
            "https://dummyjson.com/products?limit=10&skip=6";

        const USD_TO_INR = 88;

        let cart = [];


        // Fetch Products
        async function loadProducts() {

            try {

                const res = await fetch(URL);

                const data = await res.json();

                let rows = "";


                data.products.map((i, index) => {

                    const priceInRupees =
                        i.price * USD_TO_INR;


                    rows += `

                        <tr>

                            <td>
                                ${index + 1}
                            </td>


                            <td>
                                ${i.title}
                            </td>


                            <td>

                                <img
                                    src="${i.images[0]}"
                                    width="50"
                                    height="50"
                                >

                            </td>


                            <td>
                                ${i.category}
                            </td>


                            <td>
                                ${i.rating}
                            </td>


                            <td>
                                ₹${priceInRupees.toFixed(2)}
                            </td>


                            <td>
                                ${i.stock}
                            </td>


                            <!-- Quantity + Add to Cart -->

                            <td>

                                <div class="quantity-section">

                                    <!-- Minus / Quantity / Plus -->

                                    <div class="quantity-controls">

                                        <button
                                            onclick="
                                                decreaseQuantity(${i.id})
                                            "
                                        >
                                            −
                                        </button>


                                        <span
                                            class="quantity"
                                            id="quantity-${i.id}"
                                        >
                                            0
                                        </span>


                                        <button
                                            onclick="
                                                increaseQuantity(${i.id})
                                            "
                                        >
                                            +
                                        </button>

                                    </div>


                                    <!-- Add to Cart -->

                                    <div class="add-cart">

                                        <input
                                            type="checkbox"
                                            id="check-${i.id}"
                                            onchange="
                                                addToCart(
                                                    ${i.id},
                                                    '${i.title}',
                                                    ${priceInRupees},
                                                    this
                                                )
                                            "
                                        >

                                        <label
                                            for="check-${i.id}"
                                        >
                                            Add to Cart
                                        </label>

                                    </div>

                                </div>

                            </td>

                        </tr>

                    `;

                });


                document.getElementById(
                    "productTable"
                ).innerHTML = rows;

            }

            catch (err) {

                console.log("Error:", err);

            }

        }


        // Add / Remove Product
        function addToCart(
            id,
            title,
            price,
            checkbox
        ) {

            if (checkbox.checked) {

                cart.push({

                    id: id,

                    title: title,

                    price: price,

                    quantity: 1

                });


                document.getElementById(
                    `quantity-${id}`
                ).innerText = 1;

            }

            else {

                cart = cart.filter(
                    item => item.id !== id
                );


                document.getElementById(
                    `quantity-${id}`
                ).innerText = 0;

            }


            console.log("Cart:", cart);

        }


        // Increase Quantity
        function increaseQuantity(id) {

            const product =
                cart.find(item => item.id === id);


            if (product) {

                // Check stock
                const quantity =
                    product.quantity + 1;

                product.quantity = quantity;


                document.getElementById(
                    `quantity-${id}`
                ).innerText = quantity;

            }

            else {

                alert(
                    "Please select Add to Cart first."
                );

            }

        }


        // Decrease Quantity
        function decreaseQuantity(id) {

            const product =
                cart.find(item => item.id === id);


            if (product) {

                if (product.quantity > 1) {

                    product.quantity--;

                }


                document.getElementById(
                    `quantity-${id}`
                ).innerText =
                    product.quantity;

            }

            else {

                alert(
                    "Please select Add to Cart first."
                );

            }

        }


        // Place Order
        function placeOrder() {

            if (cart.length === 0) {

                alert(
                    "Your cart is empty!"
                );

                return;

            }


            let total = 0;


            let details = `
                <h2>Order Summary</h2>
            `;


            cart.forEach(item => {

                const itemTotal =
                    item.price * item.quantity;


                total += itemTotal;


                details += `

                    <p>

                        <strong>
                            ${item.title}
                        </strong>

                        × ${item.quantity}

                        =
                        ₹${itemTotal.toFixed(2)}

                    </p>

                `;

            });


            details += `

                <hr>

                <h3>
                    Total Amount:
                    ₹${total.toFixed(2)}
                </h3>

                <button
                    onclick="confirmOrder()"
                    style="
                        padding: 10px 20px;
                        background: green;
                        color: white;
                        border: none;
                        cursor: pointer;
                    "
                >
                    Confirm Order
                </button>

            `;


            const orderDetails =
                document.getElementById(
                    "orderDetails"
                );


            orderDetails.innerHTML =
                details;


            orderDetails.style.display =
                "block";

        }


        // Confirm Order
        function confirmOrder() {

            alert(
                "Order placed successfully! 🎉"
            );

        }


        loadProducts();

    </script>

</body>

</html>
